[project]
name = "browserstonks"
version = "0.1.0"
description = "BrowserStonks: turn any Chromium-based browser into an agentic browser — form filling, session tracking, and agent-harness chat via a pluggable CLI"
requires-python = ">=3.10"
dependencies = [
    "json5>=0.9.25",
    "requests>=2.31",
    "websockets>=12.0",
]

[project.scripts]
browserstonks = "browserstonks.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["browserstonks*"]
